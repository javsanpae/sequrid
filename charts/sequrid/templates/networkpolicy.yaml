{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sequrid.fullname" . }}
  labels:
    {{- include "sequrid.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sequrid.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: http
          protocol: TCP
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  # No egress rules: all outbound traffic is denied.
  egress: []
{{- end }}
