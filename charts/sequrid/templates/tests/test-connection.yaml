apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "sequrid.fullname" . }}-test"
  # Not the selector labels: the pod must not be picked up by the Service,
  # the PodDisruptionBudget or the NetworkPolicy (which denies all egress).
  labels:
    helm.sh/chart: {{ include "sequrid.chart" . }}
    app.kubernetes.io/name: {{ include "sequrid.name" . }}-test
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: test
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: wget
      image: busybox:1.37
      command: ["wget", "-qO-", "http://{{ include "sequrid.fullname" . }}:{{ .Values.service.port }}/healthz"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
