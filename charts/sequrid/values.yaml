# Default values for sequrid.

replicaCount: 1

image:
  repository: ghcr.io/javsanpae/sequrid
  # Defaults to the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  # The app never talks to the Kubernetes API.
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt
  hosts:
    - host: sequrid.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: sequrid-tls
  #    hosts:
  #      - sequrid.example.com

# Gateway API alternative to Ingress.
httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
      # namespace: gateway-system
      # sectionName: https
  hostnames:
    - sequrid.example.com

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    memory: 64Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 20
readinessProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 10

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  minAvailable: 1

# Allows traffic in on the HTTP port and denies all egress: the pod has no
# reason to open any outbound connection.
networkPolicy:
  enabled: false
  # Restrict who can reach the pod (empty = anyone).
  ingressFrom: []
  #  - namespaceSelector:
  #      matchLabels:
  #        kubernetes.io/metadata.name: ingress-nginx

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
