name: CI

# Releases are driven by the VERSION file at the repo root. When a change is
# merged into main and VERSION holds a version that has not been released yet
# (no git tag v<VERSION>), CI publishes the image and the Helm chart with that
# version, then tags the commit and creates a GitHub release. If VERSION was
# not bumped, main still gets fresh `latest` and SHA image tags, but nothing is
# released.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  version:
    name: Read VERSION
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      release: ${{ steps.read.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: read
        name: Read and validate VERSION
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error file=VERSION::VERSION must be a semantic version like 1.2.3, got '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          released=false
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            released=true
          fi

          release=false
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" && "$released" == "false" ]]; then
            release=true
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "VERSION=$version · already released: $released · release now: $release" >> "$GITHUB_STEP_SUMMARY"

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" && "$released" == "true" ]]; then
            echo "::warning file=VERSION::v$version is already released. Bump VERSION if this change should publish a new image and chart when merged."
          fi

  test:
    name: Typecheck, unit tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint charts/sequrid
      - run: helm lint charts/sequrid --set ingress.enabled=true,httpRoute.enabled=true,autoscaling.enabled=true,podDisruptionBudget.enabled=true,networkPolicy.enabled=true
      - run: helm template sequrid charts/sequrid --set ingress.enabled=true,networkPolicy.enabled=true > /dev/null
      - name: Package with the VERSION file
        run: helm package charts/sequrid --version "${{ needs.version.outputs.version }}" --app-version "${{ needs.version.outputs.version }}"

  image:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [version, test, e2e, helm]
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      RELEASE: ${{ needs.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7

      - id: app
        name: Version shown in the app
        run: |
          if [[ "$RELEASE" == "true" ]]; then
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "version=$VERSION-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4

      # Build for the runner first and check the container really behaves:
      # health endpoint, SPA served, strict CSP that forbids any connection.
      - name: Build for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: sequrid:smoke
          build-args: |
            APP_VERSION=${{ steps.app.outputs.version }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name smoke -p 8080:8080 --read-only --tmpfs /tmp --cap-drop ALL sequrid:smoke
          for _ in $(seq 1 20); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          curl -fsS http://localhost:8080/ | grep -q '<div id="app">'
          headers=$(curl -fsSI http://localhost:8080/)
          echo "$headers"
          echo "$headers" | grep -qi "content-security-policy:.*connect-src 'none'"
          echo "$headers" | grep -qi "x-content-type-options: nosniff"
          test "$(docker inspect -f '{{.Config.User}}' sequrid:smoke)" = "101"
          docker rm -f smoke

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: End-to-end against the container
        run: |
          docker run -d --name e2e -p 8080:8080 --read-only --tmpfs /tmp sequrid:smoke
          npm ci
          npx playwright install --with-deps chromium
          E2E_BASE_URL=http://localhost:8080 npx playwright test --project=desktop
          docker rm -f e2e

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=v${{ env.VERSION }},enable=${{ env.RELEASE == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ env.VERSION }},enable=${{ env.RELEASE == 'true' }}
            type=semver,pattern={{major}},value=v${{ env.VERSION }},enable=${{ env.RELEASE == 'true' && !startsWith(env.VERSION, '0.') }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short
            type=ref,event=pr

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.app.outputs.version }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          provenance: mode=max
          sbom: true

  release:
    name: Publish Helm chart and release
    runs-on: ubuntu-latest
    needs: [version, image]
    if: needs.version.outputs.release == 'true'
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5

      - name: Package and push the chart to ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package charts/sequrid --version "$VERSION" --app-version "$VERSION"
          helm push "sequrid-${VERSION}.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"

      # Tags pushed with GITHUB_TOKEN do not trigger new workflow runs.
      - name: Tag the commit and create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          notes="$(printf '%s\n' \
            "Imagen: \`ghcr.io/${GITHUB_REPOSITORY,,}:${VERSION}\`" \
            "" \
            "Chart: \`helm install sequrid oci://ghcr.io/${owner}/charts/sequrid --version ${VERSION}\`")"
          gh release create "v$VERSION" "sequrid-${VERSION}.tgz" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes "$notes" \
            --generate-notes
